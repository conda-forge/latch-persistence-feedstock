{% set name = "latch-persistence" %}
{% set version = "0.1.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/latch_persistence-{{ version }}.tar.gz
  sha256: 340e674b2e04c1172612c64c6960cc88f946150e13d21d92719e5969afb2469b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - httpx >=0.28.0,<0.29
    - pydantic >=2,<3
    - requests >=2.32.3

test:
  imports:
    - latch_persistence
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://pypi.org/project/latch-persistence
  summary: 'File persistence for the Latch Bio platform'
  license: CC0-1.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nh13
